name: Security

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned code scanner
        run: python -m pip install semgrep==1.176.0
      - name: Validate security rule detection
        env:
          SEMGREP_SEND_METRICS: "off"
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: semgrep --test --config .semgrep/security.yml .semgrep/security.test.ts
      - name: Scan first-party code without uploading source
        run: semgrep scan --config .semgrep/security.yml --metrics=off --disable-version-check --error --strict src scripts
      - name: Install verified secret scanner
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Prove secret detection with a nonfunctional fixture
        run: |
          fixture_dir=$(mktemp -d)
          trap 'rm -rf "$fixture_dir"' EXIT
          # This generated token is synthetic and never authenticates anywhere.
          python - "$fixture_dir/example.txt" <<'PY'
          import secrets, string, sys
          token = "ghp_" + "".join(secrets.choice(string.ascii_letters + string.digits) for _ in range(36))
          with open(sys.argv[1], "w") as fixture:
              fixture.write('github_token = "' + token + '"\n')
          PY
          scan_result=0
          "$RUNNER_TEMP/gitleaks" dir "$fixture_dir" --redact=100 --no-banner --exit-code 42 || scan_result=$?
          test "$scan_result" -eq 42
      - name: Scan complete reachable Git history for secrets
        run: "$RUNNER_TEMP/gitleaks git . --redact=100 --no-banner --log-opts=--all"

  dependency-security:
    # The regular CI performs this as well; run manually to check for new advisories.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@54337e0d02de9202d0948aaff36ad556375497b9 # v7 post-7.0.0 security fix
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Shipped dependencies fail on high; the dev-only toolchain fails on critical,
      # because some high advisories there (e.g. braces) have no patched release.
      - run: npm audit --audit-level=high --omit=dev
      - run: npm audit --audit-level=critical
