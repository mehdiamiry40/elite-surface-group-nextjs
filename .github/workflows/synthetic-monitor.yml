name: Production delivery watchdog

on:
  schedule:
    # Independent, read-only fallback. Vercel owns the timely worker and
    # synthetic schedules; a delayed GitHub run is never the delivery clock.
    - cron: "43 * * * *"
  workflow_dispatch:
    inputs:
      synthetic_proof:
        description: Send a fixed Resend simulated-recipient probe and verify its signed delivery
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-synthetic-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # v7 post-7.0.0 security fix
        with:
          node-version-file: .nvmrc

      - name: Verify an explicitly requested durable synthetic probe
        if: github.event_name == 'workflow_dispatch' && inputs.synthetic_proof
        env:
          CONTACT_MONITOR_TOKEN: ${{ secrets.CONTACT_MONITOR_TOKEN }}
          MONITOR_BASE_URL: https://elitesurfacegroup.com.au
        run: node scripts/synthetic-monitor.mjs

      - name: Check production homepage and durable delivery status
        env:
          CONTACT_MONITOR_TOKEN: ${{ secrets.CONTACT_MONITOR_TOKEN }}
          MONITOR_BASE_URL: https://elitesurfacegroup.com.au
        run: node scripts/contact-status-check.mjs
