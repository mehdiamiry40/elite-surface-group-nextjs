name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: ./.github/workflows/security.yml

  verify:
    # Keep this name stable: Vercel requires this exact job before promotion.
    # A skipped job can count as success. Explicitly fail when security failed.
    if: ${{ always() }}
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require successful security checks
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
        run: test "$SECURITY_RESULT" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # v7 post-7.0.0 security fix
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Audit runtime and build dependencies
        run: npm audit --audit-level=high
      - name: Install isolated Redis test runtime
        run: sudo apt-get update && sudo apt-get install --yes redis-server
      - name: Verify real Redis recovery semantics
        run: npm run contact-redis-test
      - run: npx playwright install --with-deps chromium
      - run: npm run check

      - name: Smoke and interactive accessibility
        run: |
          npm run start > /tmp/elite-surface-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/elite-surface-server.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:3000/ > /dev/null
          npm run smoke
          npm run analytics-test
          npm run enquiry-test
          npm run a11y
