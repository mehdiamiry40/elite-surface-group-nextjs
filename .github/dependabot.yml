version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "20:00"
      timezone: Australia/Adelaide
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Keep build-tool versions inside the ranges supported by the repository's
    # Node engine, Next.js compiler integration and typescript-eslint parser.
    # Compatible majors can still be proposed individually and proven by CI.
    ignore:
      - dependency-name: "@types/node"
        versions:
          - ">=23.0.0"
      - dependency-name: eslint
        versions:
          - ">=10.0.0"
      - dependency-name: typescript
        versions:
          - ">=6.1.0"
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "20:00"
      timezone: Australia/Adelaide
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
